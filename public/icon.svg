<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle (Android Adaptive Icon shape) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative background rings -->
  <circle cx="256" cy="256" r="190" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none"/>
  <circle cx="256" cy="256" r="140" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>

  <!-- Main Wallet / Card Graphic -->
  <g filter="url(#shadow)">
    <!-- Back card -->
    <rect x="136" y="140" width="240" height="150" rx="20" fill="#065f46" opacity="0.6" transform="rotate(-6 256 215)"/>
    
    <!-- Main Card -->
    <rect x="126" y="160" width="260" height="170" rx="24" fill="url(#cardGrad)"/>
    
    <!-- Card Chip / Accent -->
    <rect x="156" y="195" width="48" height="36" rx="8" fill="url(#accentGrad)"/>
    
    <!-- Magnetic stripe / band -->
    <path d="M 126 250 L 386 250" stroke="#cbd5e1" stroke-width="4"/>

    <!-- Wallet clasp / button -->
    <rect x="330" y="210" width="56" height="48" rx="14" fill="#059669"/>
    <circle cx="354" cy="234" r="7" fill="#fbbf24"/>

    <!-- Up/Down spending dynamic arrows & Rupee symbol -->
    <g transform="translate(190, 310)">
      <circle cx="66" cy="70" r="54" fill="#ffffff" filter="url(#shadow)"/>
      <!-- Rupee Symbol in Emerald -->
      <path d="M 52 46 L 80 46 M 52 56 L 80 56 M 52 46 L 52 90 M 52 66 C 74 66 74 46 52 46 M 64 66 L 78 90" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
